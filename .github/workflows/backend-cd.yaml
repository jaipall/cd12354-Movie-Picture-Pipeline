name: Backend Continuous Deployment

on:
  push:
    branches: [ main ]
    paths:
      - 'starter/backend/**'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Lint
        run: pipenv run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install pipenv
        run: pip install pipenv

      - name: Install dependencies
        run: pipenv install --dev

      - name: Test
        run: pipenv run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Configure AWS
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Check which AWS account/role GitHub is using
      - name: Check AWS identity
        run: |
          aws sts get-caller-identity

      # Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build and push backend Docker image
      - name: Build, tag, and push backend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.AWS_ECR_REPOSITORY_BACKEND }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd starter/backend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      # Configure kubectl for EKS
      - name: Set up Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --name ${{ secrets.AWS_EKS_CLUSTER_NAME }} \
            --region ${{ secrets.AWS_REGION }}

      # Deploy backend to Kubernetes
      - name: Deploy to Kubernetes via Kustomize
        run: |
          cd starter/backend/k8s

          kustomize edit set image \
            backend=${{ steps.login-ecr.outputs.registry }}/${{ secrets.AWS_ECR_REPOSITORY_BACKEND }}:${{ github.sha }}

          kustomize build . | kubectl apply -f -

      # Debug Kubernetes if deployment has a problem
      - name: Debug Kubernetes
        if: always()
        run: |
          echo "----- Deployment -----"
          kubectl get deployment backend -o wide

          echo "----- ReplicaSets -----"
          kubectl get rs -l app=backend -o wide

          echo "----- Pods -----"
          kubectl get pods -l app=backend -o wide

          echo "----- Pod Details -----"
          kubectl describe pods -l app=backend

          echo "----- Deployment Details -----"
          kubectl describe deployment backend

      # Verify Kubernetes deployment
      - name: Verify Kubernetes deployment
        run: |
          kubectl rollout status deployment/backend --timeout=180s

          echo "----- Logging - kubectl get all -----"
          kubectl get all

          echo "----- Logging - kubectl describe deploy backend -----"
          kubectl describe deploy backend

      # Verify ECR image
      - name: Verify Backend ECR image
        run: |
          echo "----- Logging - Backend ECR Image Details -----"

          AWS_PAGER="" aws ecr describe-images \
            --repository-name ${{ secrets.AWS_ECR_REPOSITORY_BACKEND }} \
            --image-ids imageTag=${{ github.sha }}